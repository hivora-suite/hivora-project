name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N, a pre-release) on a commit of main: checks the version
# everywhere, builds the image for amd64 + arm64 without publishing it, creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tagged commit is on main (tested there by CI)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag, pyproject.toml and package.json agree; CHANGELOG.md has the section
        id: check
        run: sh .github/scripts/release-check.sh "$GITHUB_REF_NAME" notes.md >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notes
          path: notes.md

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flag=""
          [ "$PRERELEASE" = "true" ] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Hivora Project $GITHUB_REF_NAME" \
            --notes-file notes.md $flag
