# Hivora Project with Docker Compose, built from the sources of a GitHub Release.
#
#   HIVORA_PROJECT_BIND=192.0.2.10 docker compose -f deploy/compose.yaml up -d --build
#
# HIVORA_PROJECT_BIND: this machine's address; the application listens on it only.
name: hivora-project

services:
  app:
    build: ..
    image: hivora-project:local
    container_name: hivora-project
    restart: unless-stopped
    ports:
      - "${HIVORA_PROJECT_BIND:?set HIVORA_PROJECT_BIND to this machine's address}:8080:8080"
    volumes:
      - data:/opt/hivora-project/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
